version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: livechat_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: livechat
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livechat_backend
    restart: always
    ports:
      - "5000:5000"
      - "80:5000" # Tambahan port 80 untuk Cloudflare
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/livechat?schema=public
      PORT: 5000
      # Add OPENAI_API_KEY and GEMINI_API_KEY here later
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.dcode.biz.id
    container_name: livechat_frontend
    restart: always
    ports:
      - "5671:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://api.dcode.biz.id
    depends_on:
      - backend

volumes:
  pgdata:
